name: Standalone showcase checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline checks
        run: sudo unshare --net -- "$(command -v python)" -m unittest discover -s tests -v
